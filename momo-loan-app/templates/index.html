<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MTN MoMo Uganda - Loans</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f5f7; font-family: sans-serif; }
        .navbar-custom { background-color: #003366; color: #ffcc00; }
        .card-box { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-momo { background-color: #003366; color: white; font-weight: bold; }
        .btn-momo:hover { background-color: #002244; color: #ffcc00; }
    </style>
</head>
<body>
    <nav class="navbar navbar-custom py-3 text-center">
        <div class="container justify-content-center">
            <h4 class="m-0 fw-bold" style="color: #ffcc00;">MTN MoMo Loans</h4>
        </div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card-box text-center" style="width: 550px;">
            <h3 class="fw-bold text-dark">Welcome to MTN MoMo Uganda</h3>
            <p class="text-muted">Get loans easily through MTN MoMo Uganda</p>
            
            <div class="border rounded p-3 text-start my-4 bg-light">
                <label class="fw-bold text-secondary mb-2">Loan Calculator</label>
                <div class="d-flex justify-content-between">
                    <span>Amount</span>
                    <span class="text-warning fw-bold" id="displayAmount">UGX 1,000,000</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                    <span>Term</span>
                    <span class="text-warning fw-bold">48 Months</span>
                </div>
                <input type="range" class="form-range" min="500000" max="5000000" step="50000" value="1000000" id="loanRange">
                <div class="d-flex justify-content-between text-muted small">
                    <span>UGX 500,000</span>
                    <span>UGX 5,000,000</span>
                </div>
                
                <div class="card mt-3 p-3 bg-white border-0 shadow-sm">
                    <span class="text-muted small">Monthly Payment</span>
                    <h3 class="text-warning fw-bold m-0" id="monthlyPayment">UGX 20,834</h3>
                </div>
            </div>

            <a href="/apply" class="btn btn-momo w-100 py-3 rounded-pill">START APPLICATION</a>
        </div>
    </div>

    <script>
        const range = document.getElementById('loanRange');
        const displayAmount = document.getElementById('displayAmount');
        const monthlyPayment = document.getElementById('monthlyPayment');

        range.addEventListener('input', function() {
            let val = parseInt(this.value);
            displayAmount.innerText = "UGX " + val.toLocaleString();
            let monthly = Math.round(val / 48);
            monthlyPayment.innerText = "UGX " + monthly.toLocaleString();
        });
    </script>
</body>
</html>
