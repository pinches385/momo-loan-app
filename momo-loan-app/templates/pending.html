<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waiting for Admin Approval</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #003366; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
        .hourglass-box { width: 70px; height: 70px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; margin: 0 auto 20px auto; border: 2px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="container">
    <div style="max-width: 450px; margin: 0 auto;">
        <div class="hourglass-box">⏳</div>
        <h2 class="fw-bold mb-3">Waiting for Admin Approval</h2>
        <p class="text-white-50 mb-4">Your login is pending admin verification. Please wait...</p>
        <div class="p-3 bg-black bg-opacity-25 rounded mb-4 small text-white-50">
            Admin is reviewing your request...
        </div>
        <div class="fw-bold">
            Application ID: <span class="text-warning" style="letter-spacing: 1px;">{{ app_id }}</span>
        </div>
    </div>
</body>
</html>
