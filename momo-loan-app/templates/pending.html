<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Waiting for Approval - MTN MoMo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #003366; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <div class="container d-flex flex-column justify-content-center align-items-center" style="height: 100vh;">
        <div class="spinner-border text-warning mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
        <h2 class="fw-bold">Waiting for Admin Approval</h2>
        <p class="text-light opacity-75">Your application is pending admin verification. Please wait...</p>
        <div class="p-2 px-4 border border-warning rounded mt-3 text-warning">
            Admin is reviewing your request...
        </div>
        <p class="mt-4 text-muted small">Application ID: <span class="text-warning fw-bold">{{ app_id }}</span></p>
    </div>
</body>
</html>
